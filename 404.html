<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>404 — Page Not Found | Bryan Cabrera</title>
    <meta name="description" content="This page doesn't exist." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .notFound {
        min-height: 78vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 80px clamp(20px, 5vw, 40px);
      }
      .notFound .eyebrow {
        margin-bottom: 18px;
      }
      .notFound h1 {
        margin-bottom: 14px;
      }
      .notFound .lede {
        margin: 0 auto 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="header">
        <span class="wordmark">Bryan Cabrera</span>
      </header>
      <section class="notFound">
        <div>
          <span class="eyebrow">404</span>
          <h1>Nothing on this shelf.</h1>
          <p class="lede">
            Whatever you were looking for isn't here.
          </p>
          <div>
            <a class="btnFill" href="/">Back to home</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
